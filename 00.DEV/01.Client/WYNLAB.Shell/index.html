<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>WYN LAB 설치</title>
<style>
  * { box-sizing: border-box; }
  body {
    margin: 0;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    background: #1B2A3D;
    font-family: "맑은 고딕", "Malgun Gothic", "Segoe UI", sans-serif;
  }
  .card {
    background: #ffffff;
    border-radius: 12px;
    padding: 48px 56px;
    max-width: 420px;
    width: 90%;
    text-align: center;
    box-shadow: 0 20px 60px rgba(0, 0, 0, 0.35);
  }
  .logo {
    width: 56px;
    height: 56px;
    margin: 0 auto 20px;
    border-radius: 12px;
    background: linear-gradient(135deg, #4A86E8, #1B2A3D);
    display: flex;
    align-items: center;
    justify-content: center;
    color: #fff;
    font-weight: 700;
    font-size: 22px;
  }
  h1 {
    margin: 0 0 8px;
    font-size: 22px;
    color: #1B2A3D;
  }
  p {
    margin: 0 0 28px;
    color: #666;
    font-size: 14px;
    line-height: 1.6;
  }
  a.install-btn {
    display: inline-block;
    width: 100%;
    padding: 14px 0;
    background: #1B2A3D;
    color: #fff;
    text-decoration: none;
    font-size: 15px;
    font-weight: 600;
    border-radius: 8px;
    transition: background 0.15s ease;
  }
  a.install-btn:hover { background: #2A3F5A; }
  .hint {
    margin-top: 18px;
    font-size: 12px;
    color: #999;
  }
</style>
</head>
<body>
  <div class="card">
    <div class="logo">W</div>
    <h1>WYN LAB</h1>
    <p>아래 버튼을 눌러 WYN LAB 클라이언트를 설치하세요.<br />이미 설치되어 있다면 최신 버전으로 자동 업데이트됩니다.</p>
    <a class="install-btn" href="WYNLAB.application">지금 설치하기</a>
    <div class="hint">문제가 있으면 관리자에게 문의해주세요.</div>
  </div>
</body>
</html>
